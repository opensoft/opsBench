name: sys-benches

services:
  ops-bench:
    image: ops-bench:${USER:-brett}
    container_name: ops-bench
    command: ["/bin/bash", "-c", 'sudo install -d -m 0700 -o "$$(id -u)" -g "$$(id -g)" "$$HOME/.workbenches-history" && if [ -f "$$HOME/.workbenches-history/.zsh_history" ]; then sudo chown "$$(id -u):$$(id -g)" "$$HOME/.workbenches-history/.zsh_history"; fi && exec sleep infinity']
    volumes:
      - opsbench-zshhistory:/home/${USER:-brett}/.workbenches-history
    working_dir: /workspace
    privileged: true
    environment:
      - HISTFILE=/home/${USER:-brett}/.workbenches-history/.zsh_history
      - DOCKER_HOST=unix:///var/run/docker.sock

volumes:
  opsbench-zshhistory:
    # Retain the existing volume; override for a legacy engine name.
    name: ${WORKBENCH_HISTORY_VOLUME:-opsbench-zshhistory}
