name: sys-benches

services:
  ops-bench:
    image: ops-bench:${USER}
    container_name: ops-bench
    command: ["/bin/bash", "-c", 'sudo install -d -m 0700 -o "$$(id -u)" -g "$$(id -g)" "$$HOME/.workbenches-history" && if [ -f "$$HOME/.workbenches-history/.zsh_history" ]; then sudo chown "$$(id -u):$$(id -g)" "$$HOME/.workbenches-history/.zsh_history"; fi && exec sleep infinity']
    volumes:
      - opsbench-zshhistory:/home/${USER}/.workbenches-history
      - ../:/workspace:cached
      - ~/projects:/projects:cached
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.gitconfig:/home/${USER}/.gitconfig:ro
      - ~/.ssh:/home/${USER}/.ssh:ro
    working_dir: /workspace
    environment:
      - HISTFILE=/home/${USER}/.workbenches-history/.zsh_history
      - DOCKER_HOST=unix:///var/run/docker.sock
    privileged: true
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: host

volumes:
  opsbench-zshhistory:
    name: opsbench-zshhistory
